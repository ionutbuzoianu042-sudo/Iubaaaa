<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Joc pentru Iubaa ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    overflow: hidden;
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
}

h1 {
    margin-top: 20px;
}

#score {
    font-size: 22px;
    margin-bottom: 20px;
}

.heart {
    position: absolute;
    font-size: 40px;
    cursor: pointer;
    transition: transform 0.2s;
}

.heart:hover {
    transform: scale(1.3);
}
</style>
</head>

<body>

<h1>Prinde inimioara, Iubaa ❤️</h1>
<div id="score">Inimioare prinse: 0 / 10</div>

<script>
let score = 0;

function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    
    heart.style.left = Math.random() * (window.innerWidth - 50) + "px";
    heart.style.top = Math.random() * (window.innerHeight - 50) + "px";

    heart.onclick = function() {
        score++;
        document.getElementById("score").innerHTML = 
            "Inimioare prinse: " + score + " / 10";
        heart.remove();

        if (score >= 10) {
            setTimeout(() => {
                alert("Iubaa ❤️ Ai câștigat! Premiul tău: un iubit care te iubește infinit 💕");
            }, 300);
        } else {
            createHeart();
        }
    };

    document.body.appendChild(heart);
}

createHeart();
</script>

</body>
</html>
